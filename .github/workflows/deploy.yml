name: Build Vite and deploy to Hostinger

on:
  push:
    branches: ["main"]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Vite
        run: |
          npm run build
          test -f public/build/manifest.json

      - name: Ensure remote build dir exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script: |
            mkdir -p /home/u206029413/domains/cumplemiamor.cramultimedia.com/public_html/public/build

      - name: Upload Vite build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          source: "public/build/*"
          target: "/home/u206029413/domains/cumplemiamor.cramultimedia.com/public_html/public/build"
          strip_components: 2

      - name: Sincronizar codigo PHP y migrar en el servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script: |
            set -e
            cd /home/u206029413/domains/cumplemiamor.cramultimedia.com/public_html
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            # Idempotent: publishes newly installed case manifests into the
            # catalog and refreshes their content fields. Prices and
            # publication state set in the database are left untouched.
            php artisan platform:sync-cases
            php artisan optimize:clear
            # Workers hold the old code in memory; this tells the ones the
            # scheduler starts to pick up this release.
            php artisan queue:restart
            ls -la public/build/manifest.json

      # NOTA: no se puede gestionar el cron por SSH en este hosting compartido
      # (el comando "crontab" no esta disponible para este usuario). El cron
      # del scheduler de Laravel debe agregarse manualmente una sola vez desde
      # el panel de Hostinger (hPanel > Avanzado > Cron Jobs). Ver instrucciones
      # en app/Modules/Immersion/README.md.

      - name: Diagnostico post-deploy (solo lectura)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 65002
          script: |
            cd /home/u206029413/domains/cumplemiamor.cramultimedia.com/public_html
            echo "--- IMMERSION_AI_SERVICE_URL configurada en produccion ---"
            grep "^IMMERSION_AI_SERVICE_URL=" .env || echo "NO esta definida en .env"
            echo "--- IMMERSION_AI_PROJECT_ID configurado ---"
            grep "^IMMERSION_AI_PROJECT_ID=" .env || echo "NO esta definida en .env"
            echo "--- IMMERSION_AI_INTERNAL_API_KEY definida? (no se imprime el valor) ---"
            grep -q "^IMMERSION_AI_INTERNAL_API_KEY=." .env && echo "si, tiene valor" || echo "NO tiene valor"
            echo "--- IMMERSION_GM_PASSWORD definida? ---"
            grep -q "^IMMERSION_GM_PASSWORD=." .env && echo "si, tiene valor" || echo "NO tiene valor"
            echo "--- ultimas lineas de log relacionadas con audio TTS de Immersion ---"
            grep -i "immersion_tts" storage/logs/laravel.log 2>&1 | tail -20 || echo "sin coincidencias"
            echo "--- ultimas lineas de log relacionadas con el timeline de Immersion ---"
            grep -i "immersion" storage/logs/laravel.log 2>&1 | tail -30 || echo "sin coincidencias"